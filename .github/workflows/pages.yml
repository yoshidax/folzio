name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'yoshidax/folzio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check site
        run: python3 scripts/check-site.py --release site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
