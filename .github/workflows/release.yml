name: Build release draft
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'yoshidax/folzio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan
  release:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck release state before build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan
      - name: Select toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Normal tests
        timeout-minutes: 10
        run: swift test --no-parallel --skip FolzioPerformanceTests
      - name: Package public commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
        run: |
          mkdir "$RUNNER_TEMP/release-source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/release-source"
          bash scripts/package-release.sh "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/release-source" "$RUNNER_TEMP/release"
      - name: Create immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py draft "$RUNNER_TEMP/release"
