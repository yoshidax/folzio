<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Port of Sources/make-icon/main.swift (CoreGraphics, y-up) to SVG. The group flips the y axis. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="512" y1="924" x2="512" y2="100">
      <stop offset="0" stop-color="#364f8f"/>
      <stop offset="1" stop-color="#0f172b"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="512" cy="924" r="620">
      <stop offset="0" stop-color="#8cb8ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8cb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="708.5" y1="810" x2="708.5" y2="214">
      <stop offset="0" stop-color="#5eabe0"/>
      <stop offset="1" stop-color="#1a4f78"/>
