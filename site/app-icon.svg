      <circle cx="753.16" cy="631.2" r="20.3" fill="#ffd961"/>
      <path d="M607 214 L671.96 464.32 L718.65 345.12 L761.28 440.48 L810 321.28 L810 214 Z" fill="#123d47" fill-opacity="0.95"/>
