    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="3"/>
    <rect x="168" y="168" width="688" height="688" rx="64" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-width="4"/>

    <rect x="194" y="194" width="158" height="636" rx="26" fill="#3361ad" fill-opacity="0.95" stroke="#fff" stroke-opacity="0.14" stroke-width="3"/>
    <rect x="366" y="194" width="207" height="636" rx="26" fill="#172136" fill-opacity="0.95" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
    <rect x="587" y="194" width="243" height="636" rx="26" fill="#121c30" fill-opacity="0.95" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>

    <!-- folder -->
    <rect x="225.6" y="518.83" width="45.5" height="20.48" rx="5.46" fill="#f0f7ff" fill-opacity="0.96"/>
    <rect x="225.6" y="477.87" width="94.8" height="49.14" rx="6.83" fill="#f0f7ff" fill-opacity="0.96"/>
    <rect x="240.77" y="492.89" width="64.46" height="6" rx="3" fill="#3361ad" fill-opacity="0.55"/>

