    <rect x="390" y="218" width="72.5" height="287" rx="16" fill="#549ef2"/>
    <rect x="400" y="228" width="52.5" height="267" rx="10" fill="#fff" fill-opacity="0.18"/>
    <rect x="476.5" y="218" width="72.5" height="287" rx="16" fill="#4dcca3"/>
    <rect x="486.5" y="228" width="52.5" height="267" rx="10" fill="#fff" fill-opacity="0.18"/>
    <rect x="390" y="519" width="72.5" height="287" rx="16" fill="#f7ab3b"/>
    <rect x="400" y="529" width="52.5" height="267" rx="10" fill="#fff" fill-opacity="0.18"/>
    <rect x="476.5" y="519" width="72.5" height="287" rx="16" fill="#e86e8f"/>
