    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="ph"><rect x="607" y="214" width="203" height="596" rx="18"/></clipPath>
  </defs>
  <g transform="translate(0 1024) scale(1 -1)">
